services:
  playwright:
    build:
      context: .
    init: true
    shm_size: 1gb
    environment:
      USER_EMAIL: "${USER_EMAIL:?Set USER_EMAIL in .env}"
      USER_PASSWORD: "${USER_PASSWORD:?Set USER_PASSWORD in .env}"
      APP_URL: "${APP_URL:-https://conduit.bondaracademy.com}"
      API_URL: "${API_URL:-https://conduit-api.bondaracademy.com/api}"
    ports:
      - "9323:9323"
    volumes:
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report
      - ./allure-results:/app/allure-results
    command: ["npm", "test"]
